version: '3.8'

services:
  neo4j:
    image: neo4j:5.15
    container_name: autodrive-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/autodrive123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "autodrive123", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - autodrive-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: autodrive-api
    network_mode: "host"
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - NEO4J_URI=bolt://localhost:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=autodrive123
      - PYTHONUNBUFFERED=1
    volumes:
      - ./preprocessing/output:/app/preprocessing/output:ro
    depends_on:
      neo4j:
        condition: service_healthy
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: autodrive-streamlit
    network_mode: "host"
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - NEO4J_URI=bolt://localhost:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=autodrive123
      - API_BASE_URL=http://localhost:8000
      - PYTHONUNBUFFERED=1
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:

networks:
  autodrive-network:
    driver: bridge